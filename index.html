<style>
:root{--ivory:#fbf7ef;--green:#1f4d3f;--gold:#a8843c;--lgold:#d9bd7c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:400;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1,'kern' 1;background:var(--ivory);color:var(--green);overflow:hidden}
.page{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s;overflow:hidden auto;background:var(--ivory)}
.page.active{opacity:1;visibility:visible}
.page.dark{background:var(--green);color:var(--ivory)}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 28px 110px}
.cap{font-size:.95rem;letter-spacing:.3em;text-transform:uppercase;font-weight:500}
.gold{color:var(--gold)}.dark .gold{color:var(--lgold)}
.names{font-weight:300;font-size:clamp(4rem,min(17vw,13vh),7.5rem);line-height:.95;margin:22px 0 12px}
.names i{display:block;font-size:.5em;color:var(--gold);margin:4px 0 6px}
.h{font-weight:300;font-size:clamp(2.4rem,min(9vw,8vh),3.8rem);line-height:1.08}
.orn{width:120px;height:12px;color:var(--gold);margin:22px auto;display:block}
.dark .orn{color:var(--lgold)}
.val{font-size:clamp(1.8rem,6vw,2.3rem);font-weight:400;line-height:1.2;margin-top:6px}
.txt{font-size:1.3rem;font-style:italic;max-width:26ch;margin:0 auto}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.btn{display:inline-block;padding:13px 30px;border:1px solid var(--green);border-radius:40px;background:transparent;color:var(--green);font:inherit;font-weight:500;font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:.25s}
.btn.fill{background:var(--green);color:var(--ivory)}
.btn:hover{opacity:.8}
.rsvp{width:100%;max-width:340px;margin-top:26px}
.rsvp input{width:100%;padding:12px 4px;border:none;border-bottom:1px solid var(--lgold);background:transparent;color:var(--ivory);font:inherit;font-size:1.4rem;text-align:center;outline:none;border-radius:0}
.rsvp input::placeholder{color:rgba(251,247,239,.65)}
.rsvp .btn{width:100%;margin-top:16px;border-color:var(--ivory);color:var(--ivory)}
.rsvp .btn.yes{background:var(--ivory);color:var(--green)}
.rise{opacity:0;transform:translateY(14px)}
.page.active .rise{animation:rise 1s ease forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
.nav{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));translate:-50% 0;width:60px;height:60px;padding:0;border:0;border-radius:50%;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;isolation:isolate;overflow:hidden;color:var(--green);
background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.01));
-webkit-backdrop-filter:blur(2px) saturate(1.5) brightness(1);backdrop-filter:blur(2px) saturate(1.5) brightness(1);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 2px 3px 5px rgba(255,255,255,.5),inset -2px -3px 6px rgba(31,77,63,.16),0 10px 26px rgba(31,77,63,.18),0 2px 6px rgba(0,0,0,.06);
transition:scale .35s cubic-bezier(.3,1.7,.5,1),color .4s}
.nav::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:50%;background:radial-gradient(120% 90% at 28% 10%,rgba(255,255,255,.22),rgba(255,255,255,0) 46%),radial-gradient(90% 70% at 75% 100%,rgba(255,255,255,.07),rgba(255,255,255,0) 60%)}
.nav:active{scale:.9}
.nav:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.nav.onDark{color:var(--ivory);background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.01));box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),inset 2px 3px 5px rgba(255,255,255,.3),inset -2px -3px 6px rgba(0,0,0,.2),0 10px 26px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.12)}
html.lg .nav{-webkit-backdrop-filter:blur(3px) url(#lg60) saturate(1.7) brightness(1.02);backdrop-filter:blur(3px) url(#lg60) saturate(1.7) brightness(1.02)}
html.lg .nav.onDark{-webkit-backdrop-filter:blur(3px) url(#lg60) saturate(1.15) brightness(1.06);backdrop-filter:blur(3px) url(#lg60) saturate(1.15) brightness(1.06)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.nav{background:rgba(255,255,255,.72)}.nav.onDark{background:rgba(255,255,255,.22)}}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav.hidden{display:none}
@media(max-width:480px){.cap{font-size:.82rem;letter-spacing:.2em}.wrap{padding-top:40px}}
</style>
</head>
<body>

<section class="page active"><div class="wrap">
  <div class="cap gold rise" style="--d:.2s">Together with our families</div>
  <h1 class="names rise" style="--d:.5s">Manju<i>&amp;</i>Rohit</h1>
  <svg class="orn" viewBox="0 0 120 12"><path d="M0 6H46M74 6H120" stroke="currentColor" stroke-width="1"/><path d="M60 1L65 6L60 11L55 6Z" fill="currentColor"/></svg>
  <div class="cap rise" style="--d:1.1s">Saturday · 12 December 2026</div>
  <p class="txt rise" style="--d:1.3s;margin-top:14px">invite you to celebrate their wedding</p>
</div></section>

<section class="page"><div class="wrap">
  <div class="cap gold rise" style="--d:.1s">Join us for the celebration</div>
  <h2 class="h rise" style="--d:.3s;margin-top:14px">The Details</h2>
  <svg class="orn" viewBox="0 0 120 12"><path d="M0 6H46M74 6H120" stroke="currentColor" stroke-width="1"/><path d="M60 1L65 6L60 11L55 6Z" fill="currentColor"/></svg>
  <div class="rise" style="--d:.5s"><div class="cap gold">The day</div><div class="val">Saturday, 12 December 2026</div></div>
  <svg class="orn" viewBox="0 0 120 12"><path d="M0 6H46M74 6H120" stroke="currentColor" stroke-width="1"/><path d="M60 1L65 6L60 11L55 6Z" fill="currentColor"/></svg>
  <div class="rise" style="--d:.7s"><div class="cap gold">The time</div><div class="val">8:00 AM IST</div></div>
  <svg class="orn" viewBox="0 0 120 12"><path d="M0 6H46M74 6H120" stroke="currentColor" stroke-width="1"/><path d="M60 1L65 6L60 11L55 6Z" fill="currentColor"/></svg>
  <div class="rise" style="--d:.9s"><div class="cap gold">The place</div><div class="val">Cheshire Village</div></div>
  <div class="btns rise" style="--d:1.1s">
    <a class="btn fill" href="https://maps.app.goo.gl/ZJtv7buVNM3VMAvv9" target="_blank" rel="noopener">Open in Google Maps</a>
    <button class="btn" id="saveDate">Save the date</button>
  </div>
</div></section>

<section class="page dark"><div class="wrap">
  <div class="cap gold rise" style="--d:.1s">Kindly reply</div>
  <h2 class="h rise" style="--d:.3s;margin-top:14px">Will you join us?</h2>
  <svg class="orn" viewBox="0 0 120 12"><path d="M0 6H46M74 6H120" stroke="currentColor" stroke-width="1"/><path d="M60 1L65 6L60 11L55 6Z" fill="currentColor"/></svg>
  <div class="rsvp rise" style="--d:.6s">
    <input id="name" type="text" placeholder="Your name" autocomplete="name">
    <button class="btn yes" id="yes">Joyfully accepts</button>
    <button class="btn" id="no">Regretfully declines</button>
  </div>
</div></section>

<button class="nav" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="nav onDark hidden" id="restart" aria-label="Start over"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>

<script>
(function(){
  var pages=document.querySelectorAll('.page'),i=0,nav=document.getElementById('next'),last=pages.length-1,restartBtn=document.getElementById('restart');
  function show(n){
    i=n;
    pages.forEach(function(p,k){p.classList.toggle('active',k===n)});
    nav.classList.toggle('hidden',n===last);
    restartBtn.classList.toggle('hidden',n!==last);
  }
  nav.addEventListener('click',function(){if(i<last)show(i+1)});
  restartBtn.addEventListener('click',function(){show(0)});

  function sendRsvp(attending){
    var name=document.getElementById('name').value.trim();
    if(!name){alert('Please enter your name.');return}
    var msg='Hello! This is '+name+'. I '+(attending?'will be attending':'will not be able to attend')+' the wedding of Manju & Rohit on 12 December 2026 at Cheshire Village.';
    window.open('https://wa.me/919995080240?text='+encodeURIComponent(msg),'_blank');
  }
  document.getElementById('yes').addEventListener('click',function(){sendRsvp(true)});
  document.getElementById('no').addEventListener('click',function(){sendRsvp(false)});

  document.getElementById('saveDate').addEventListener('click',function(){
    var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wedding Invite//EN','BEGIN:VEVENT','UID:manju-rohit-wedding-20261212@invite','DTSTAMP:20261112T000000Z','DTSTART:20261212T023000Z','DTEND:20261212T043000Z',"SUMMARY:Manju & Rohit's Wedding",'LOCATION:Cheshire Village','DESCRIPTION:Directions: https://maps.app.goo.gl/ZJtv7buVNM3VMAvv9','END:VEVENT','END:VCALENDAR'].join('\r\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
    a.download='manju-rohit-wedding.ics';
    document.body.appendChild(a);a.click();a.remove();
  });
})();
</script>

</body>
